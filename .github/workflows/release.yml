# SPDX-License-Identifier: GPL-3.0-only
# The release, built and signed on GitHub by the Firmware Hub's shared workflow (zvenson/fm1-build): a tag vX.Y
# builds fm1-dock-X.Y.fwsc, attests it and publishes it as the release of that tag (the hub's "Built from source on
# GitHub"). A pull request builds without a release, to show that it still builds there.
# Do not replace the .fwsc on a release by hand: the hub compares it with the attested one. (The .syms may be added.)
name: release
on:
  push:
    tags: ["v*"]
  pull_request:
jobs:
  build:
    uses: zvenson/fm1-build/.github/workflows/build.yml@v1
    permissions:
      contents: write        # the release
      id-token: write        # the signing certificate
      attestations: write    # the attestation
    with:
      build: |
        if [ "$GITHUB_REF_TYPE" = tag ]; then ./build.sh --release "${GITHUB_REF_NAME#v}"; else ./build.sh; fi
      packages: build/fm1-dock*.fwsc
