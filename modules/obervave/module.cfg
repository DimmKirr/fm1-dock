# OBERVAVE: zvenson/obervave (bcddc4b), its app, voices, effects and sequencer (modules/obervave/take.py)
name = OBERVAVE
version = 1
# the effects in 272 KiB of module RAM with the rest (OberVave on Dinghy: ~357 KiB): the reverb at half
# its rate (REV_DIV 2, as obv_fx.h offers "if the chip turns out to need it": half its memory and time),
# the delay 464 ms a side (743 on Dinghy; a longer note value is clamped to it)
cflags = -DREV_DIV=2u -DDLY_MAX=20480u
