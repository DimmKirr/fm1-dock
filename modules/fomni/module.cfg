# FOMNI: charlesvestal/fm1-fomni (7e7547f), Charles Vestal's chord harp after the Omnichord (take.py)
name = FOMNI
version = 1
sources = fomni/dsp/omni.c
# the FPU, as FoMni builds itself (its single-precision floats in the general registers: nothing more to save in the
# audio interrupt)
cflags = -mcpu=r3 -mfprev1 -ffp-contract=off -Imodules/fomni/fomni -Imodules/fomni/fomni/app -Imodules/fomni/fomni/dsp
