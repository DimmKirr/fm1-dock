# AMB-1: charlesvestal/fm1-amb (7797f4e, fm1-base 934e40d), Charles Vestal's generative ambient machine (take.py)
name = AMB-1
version = 1
sources = amb/amb.c

# the FPU, as fm1-base builds AMB-1 (its single-precision floats in the general registers: nothing more to save in the
# audio interrupt); the screen's canvas is fm1-base's (240 x 144)
cflags = -mcpu=r3 -mfprev1 -ffp-contract=off -Imodules/amb/amb -DTAPE_N=54000 -DPL_Q=8192
